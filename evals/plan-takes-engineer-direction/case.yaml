schema_version: "1.1"
name: plan-takes-engineer-direction
description: The engineer gives direction in the invocation, so the greeting texts go in a new module src/greetings.ts that homeHeader imports. The plan lists src/greetings.ts in a task's files and records the point, and where it landed, under an Engineer direction section (B10, direction carried from the command's arguments). Ported from the original's case of the same name.
tags: [plan, direction, b10]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Plan the change 2026-11-01-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/).
    Engineer direction: keep the greeting texts in a new module src/greetings.ts and have homeHeader import them.
    I am not available for questions: take the recommended answer to every question and finish the whole skill.
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: a-task-changes-greetings
    type: regex
    pattern: '"files"\s*:\s*\[[^\]]*src/greetings\.ts'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: direction-recorded
    type: regex
    pattern: '## Engineer direction\r?\n(?:(?!\n## )[\s\S])*?src/greetings\.ts'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: plan-commit-landed
    type: regex
    pattern: '\tcommit: docs\([^)\s]+\): draft plan 2026-11-01-greeting\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting/logs/HEAD
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
