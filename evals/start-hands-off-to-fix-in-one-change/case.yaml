schema_version: "1.1"
name: start-hands-off-to-fix-in-one-change
description: New in Hoshin.Net (B05, which hands off to fix in the same session without starting a second change). A bug brought to the start skill by someone who holds both roles and takes the light track is handed to the fix skill in the same session, in the order start then fix, and the workspace ends up with one change, with one start commit and one draft commit in the named change's copy, and a single hook step that drafts a fix. Nothing is accepted.
tags: [start, fix, b05]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Use the hoshin start skill for system demo. The change: returning visitors see "Welcome back,Mina" with no space after the comma. The person running this is both the engineer and the product owner. If the route is the light track, take it and run the fix skill in this session; do not ask for acceptance.

    This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). If the change gets a folder, name it 2026-11-01-greeting-space. If you offer the choices, I take the light track. I am not available for other questions: decide everything else yourself and finish.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: start-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?start"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: fix-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fix"'
  - name: start-before-fix
    type: tool_order
    before:
      tool: Skill
      input_match: '"skill"\s*:\s*"(?:[\w-]+:)?start"'
    after:
      tool: Skill
      input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fix"'
  - name: intent-never-ran
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?intent"'
    min: 0
    max: 0
  - name: one-hook-step-drafted-a-fix
    type: regex
    pattern: '^(?:(?!"decision"\s*:\s*"fix: Fix")[\s\S])*"decision"\s*:\s*"fix: Fix"(?:(?!"decision"\s*:\s*"fix: Fix")[\s\S])*$'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: change-started-once
    type: regex
    pattern: '^(?:(?!start change )[\s\S])*\tcommit: docs\(demo\): start change 2026-11-01-greeting-space\n(?:(?!start change )[\s\S])*$'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting-space/logs/HEAD
  - name: drafted-once
    type: regex
    pattern: '^(?:(?!draft fix )[\s\S])*\tcommit: docs\(demo\): draft fix 2026-11-01-greeting-space\n(?:(?!draft fix )[\s\S])*$'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting-space/logs/HEAD
  - name: documents-written-in-the-named-change
    type: file_exists
    path: ".hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/plan.md"
    exists: true
  - name: accepted-nothing
    type: regex
    pattern: '\tcommit(?: \(amend\))?: docs\([\w-]+\): accept (?:intent|spec|plan) '
    match: not_contains
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting-space/logs/HEAD
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: master-main-gains-no-commit
    type: regex
    pattern: '^[^\n]*\tcommit \(initial\): chore\(demo\): set up hoshin for demo\n$'
    target:
      source: file
      path: master/.git/logs/HEAD
