schema_version: "1.1"
name: fix-reopen-keeps-built-tasks
description: Reopening an accepted fix whose first task is built keeps that task counting as built (B14 engine item 3, B15 reopen rule). Reopening is typed-only in Hoshin.Net, so the fixture makes the reopen commit through the program, over a two-task fix with T1 built and logged. Given the fix skill on that change with Operator feedback that changes only what T2 does, the skill redrafts T2 and its scenario, leaves T1 in plan.md exactly as it was written and the build log untouched, and accepts nothing, so the build still counts T1 as done. The typed reopen keeping T1 built is this case's parity half. Ported from the original's case of the same name.
tags: [fix, b14, b15]
runs: 3
execution:
  prompt: |
    Use the fix skill on change 2026-10-24-greeting-space in system demo.

    Operator feedback:
    Change only what T2 does: the greeting for a returning visitor with no name should end with an exclamation mark, "Welcome back!", instead of a full stop. Leave the greeting with a name as it is.

    This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I will accept the fix again myself later, so do not accept it. I am not available for questions: decide everything yourself and finish.
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fix"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: redraft-committed-after-the-reopen
    type: regex
    pattern: '\tcommit: docs\([\w-]+\): reopen fix [\w-]+\n(?:[^\n]*\n)*[^\n]*\tcommit: docs\([\w-]+\): (?:draft|reopen) fix '
    target:
      source: file
      path: master/.git/worktrees/2026-10-24-greeting-space/logs/HEAD
  - name: no-acceptance-after-the-reopen
    type: regex
    pattern: '\tcommit: docs\([\w-]+\): reopen fix [\w-]+\n(?:(?!\tcommit(?: \(amend\))?: docs\([\w-]+\): accept )[\s\S])*$'
    target:
      source: file
      path: master/.git/worktrees/2026-10-24-greeting-space/logs/HEAD
  - name: plan-back-to-draft
    type: regex
    pattern: '"status"\s*:\s*"draft"'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/plan.md
  - name: spec-back-to-draft
    type: regex
    pattern: '"status"\s*:\s*"draft"'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/spec.md
  - name: plan-keeps-t1-as-written
    type: regex
    pattern: '### T1: Put a space after the comma\r?\n\r?\n```jsonc\r?\n\{\s*"id"\s*:\s*"T1",\s*"repo"\s*:\s*"app",\s*"depends_on"\s*:\s*\[\s*\],\s*"uses"\s*:\s*\[\s*\],\s*"files"\s*:\s*\["greet\.sh",\s*"test\.sh"\],\s*"covers"\s*:\s*\["R1\.1"\],\s*"supports"\s*:\s*\[\s*\]\s*\}\r?\n```\r?\n\r?\n#### Change\r?\n\r?\nChange the greeting in greet\.sh so a named visitor gets "Welcome back, " followed by the name, which removes the missing space named in the intent\.\r?\n\r?\n#### Tests\r?\n\r?\nAdd to test\.sh a check that `bash greet\.sh returning Mina` prints "Welcome back, Mina"\. Run `bash test\.sh`\. It fails before the change because greet\.sh prints "Welcome back,Mina"\.\r?\n\r?\n#### Done when\r?\n\r?\n`bash test\.sh` prints ok\.\r?\n'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/plan.md
  - name: plan-t2-takes-the-feedback
    type: regex
    pattern: '### T2:[\s\S]*Welcome back!'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/plan.md
  - name: spec-takes-the-feedback-and-keeps-the-named-greeting
    type: regex
    pattern: '^(?=[\s\S]*Then the greeting is "Welcome back!")(?=[\s\S]*Then the greeting is "Welcome back, Mina")'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/spec.md
  - name: build-log-unchanged
    type: regex
    pattern: '^```jsonc\r?\n\{ "layout": 2 \}\r?\n```\r?\n\r?\n# Build log: app\r?\n\r?\n### T1\r?\n\r?\n```jsonc\r?\n\{\r?\n  "task": "T1",\r?\n  "commits": \["[0-9a-f]{7,}"\]\r?\n\}\r?\n```\r?\n?$'
    target:
      source: file
      path: .hoshin/copies/2026-10-24-greeting-space/intent/demo/2026-10-24-greeting-space/build/app.md
  - name: product-repository-unchanged
    type: regex
    pattern: '\tcommit: fix: put a space after the comma\n$'
    target:
      source: file
      path: app/.git/logs/HEAD
