schema_version: "1.1"
name: review-reads-red-from-the-program
description: A fully built change whose only build-log entry says its red was not observed (not observed, no red recorded for T1 on this machine). The review skill takes the red verdict from the program's brief, not from its own reading of the log, and records a medium spec finding for repo app whose file is the build log and whose line is the entry's red line (B12 item 2 and the red-verdict judgment rule). The red line is line 12 of build/app.md; today's `read --json` reports only the entry's heading line, so a finished brief has to carry the red line. Ported from the original's case of the same name, minus its grader on a typed read command, since the brief now carries the build log.
tags: [review, b12]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Run the final review of change 2026-11-01-vip-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: decide everything yourself and finish.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: review-commit-landed
    type: regex
    pattern: '\tcommit: docs\([^)]+\): (?:review|record review 1 of) 2026-11-01-vip-greeting\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-vip-greeting/logs/HEAD
  - name: product-repository-unchanged
    type: regex
    pattern: '\tcommit: feat\(demo\): greet vip visitors as guests of honor\n$'
    target:
      source: file
      path: app/.git/logs/HEAD
  - name: red-finding-points-at-the-red-line
    type: regex
    pattern: '\{(?=[^{}]*"file"\s*:\s*"[^"]*build/app\.md")(?=[^{}]*"line"\s*:\s*12\s*[,}\n])(?=[^{}]*"concern"\s*:\s*"spec")(?=[^{}]*"severity"\s*:\s*"medium")(?=[^{}]*"repo"\s*:\s*"app")[^{}]*\}'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
  - name: red-finding-gives-the-reason
    type: regex
    pattern: 'no red recorded|red was not observed|not observed'
    flags: i
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
  - name: review-is-the-only-commit-after-the-log
    type: regex
    pattern: 'log T1 of 2026-11-01-vip-greeting\n(?:[^\n]*\n)*?[^\n]*\tcommit[^:\n]*: (?!docs\([^)]+\): (?:review|record review 1 of) 2026-11-01-vip-greeting\n)'
    match: not_contains
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-vip-greeting/logs/HEAD
  - name: master-main-gains-no-commit
    type: regex
    pattern: '^[^\n]*\tcommit \(initial\): chore\(demo\): set up hoshin for demo\n$'
    target:
      source: file
      path: master/.git/logs/HEAD
