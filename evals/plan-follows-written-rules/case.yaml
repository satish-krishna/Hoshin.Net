schema_version: "1.1"
name: plan-follows-written-rules
description: The plan runs from the workspace folder, where the app's CLAUDE.md is never loaded. That file holds a style rule (every exported function has a doc comment) and links to docs/visible-changes.md, which holds two rules the code does not show. New visible text goes in src/copy/en.json, and every visible change adds a line to CHANGELOG.md. The plan reads the app's written rules, links included, so a task lists both files, and it leaves the style rule to the build, which loads CLAUDE.md itself (B10, B01's written-rules reference). Ported from the original's case of the same name.
tags: [plan, conventions, b10, b01]
runs: 3
execution:
  prompt: |
    Plan the change 2026-11-01-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: take the recommended answer to every question and finish the whole skill.
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: a-task-changes-the-copy-file
    type: regex
    pattern: '"files"\s*:\s*\[[^\]]*src/copy/en\.json'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: a-task-adds-the-changelog-line
    type: regex
    pattern: '"files"\s*:\s*\[[^\]]*CHANGELOG\.md'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: style-rule-left-to-the-build
    type: regex
    pattern: 'doc[ -]?comment'
    flags: i
    match: not_contains
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: plan-commit-landed
    type: regex
    pattern: '\tcommit: docs\([^)\s]+\): draft plan 2026-11-01-greeting\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting/logs/HEAD
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
