schema_version: "1.1"
name: fix-refuses-a-rule-change
description: A "quick fix" that would greet first-time visitors changes context rule C2, which an engineer confirmed, so it is not small. The fix skill refuses before it writes anything, names the rule, points to the intent skill, and leaves no started change behind (B14 item 5, B01's triage reference). Ported from the original's case of the same name.
tags: [fix, b14]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Quick fix in system demo: first-time visitors should also see a greeting, "Welcome". This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: decide everything yourself.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:fix|start)"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: output-names-the-rule
    type: regex
    pattern: '\bC2\b|first-time visitors? (?:sees?|gets?) no greeting'
    flags: i
    target: last_message
  - name: output-points-to-intent
    type: regex
    pattern: '/?(?:hoshin:)?intent\b'
    target: last_message
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: master-main-gains-no-commit
    type: regex
    pattern: '^[^\n]*\tcommit \(initial\): chore\(demo\): set up hoshin for demo\n$'
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: no-change-left-behind
    type: file_exists
    path: "master/.git/refs/heads/change/*"
    exists: false
  - name: no-intent-written
    type: file_exists
    path: "**/intent.md"
    exists: false
  - name: no-spec-written
    type: file_exists
    path: "**/spec.md"
    exists: false
