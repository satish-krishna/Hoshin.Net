schema_version: "1.1"
name: plan-stops-on-direction-against-the-spec
description: The engineer's direction says a returning visitor with a first name sees a greeting without the name, which contradicts the accepted spec's scenario R1.1 (the greeting says Mina). The plan skill stops, writes and commits nothing, names the contradiction, and tells the engineer to reopen the spec. Declining is a clean outcome (B10), and the typed reopen itself is not driven here because it is human-only. Ported from the original's case of the same name.
tags: [plan, direction, b10]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Plan the change 2026-11-01-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/).
    Engineer direction: a returning visitor always sees the greeting Hello again, without the first name, even when the visitor gave one.
    I am not available for questions: take the recommended answer to every question and finish the whole skill.
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-plan-written
    type: file_exists
    path: ".hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md"
    exists: false
  - name: no-plan-written-in-the-master
    type: file_exists
    path: "master/intent/demo/*/plan.md"
    exists: false
  - name: change-gained-no-commit
    type: regex
    pattern: '\tcommit: docs\(demo\): accept spec 2026-11-01-greeting\n$'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting/logs/HEAD
  - name: names-the-contradiction
    type: regex
    pattern: 'R1\.1|\bMina\b|first name'
    flags: i
    target: last_message
  - name: names-the-spec-reopen
    type: regex
    pattern: 'reopen[\s\S]*spec|spec[\s\S]*reopen'
    flags: i
    target: last_message
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
