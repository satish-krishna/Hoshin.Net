schema_version: "1.1"
name: fix-accepts-a-bug-fix
description: A bug in one repository that breaks a context rule takes the light track (B14 engine items 2 and 5, B01's triage reference). The fix skill names the root cause at its file and line, drafts intent.md (track fix), spec.md and plan.md that pass the check, and writes no product code. It stops before acceptance, because accepting is typed-only in Hoshin.Net and the typed accept with its pins is this case's parity half. Ported from the original's case of the same name, LLM half only.
tags: [fix, b14]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Quick fix in system demo: returning visitors see "Welcome back,Mina" with no space after the comma. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). If the change gets a folder, name it 2026-11-01-greeting-space. I will accept the fix myself later, so do not accept it and do not ask me to. I am not available for questions: decide everything yourself and finish.
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:fix|start)"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: drafted-through-the-program
    type: regex
    pattern: '\tcommit: docs\([\w-]+\): draft fix 2026-11-01-greeting-space\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting-space/logs/HEAD
  - name: accepted-nothing
    type: regex
    pattern: '\tcommit(?: \(amend\))?: docs\([\w-]+\): accept (?:intent|spec|plan) '
    match: not_contains
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting-space/logs/HEAD
  - name: intent-is-on-the-fix-track
    type: regex
    pattern: '"track"\s*:\s*"fix"'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/intent.md
  - name: intent-names-the-root-cause-at-its-line
    type: regex
    pattern: 'greet\.sh(?::|,?\s+line\s+)4\b|line\s+4\s+of\s+(?:app/)?greet\.sh'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/intent.md
  - name: spec-reproduces-the-bug
    type: regex
    pattern: 'Welcome back, Mina'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/spec.md
  - name: spec-is-a-draft
    type: regex
    pattern: '"status"\s*:\s*"draft"'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/spec.md
  - name: plan-task-changes-the-greeting-script
    type: regex
    pattern: '"files"\s*:\s*\[[^\]]*greet\.sh'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/plan.md
  - name: plan-test-fails-before-the-change
    type: regex
    pattern: '#### Tests\r?\n(?:(?!\n#{1,4} )[\s\S])*?\bfail'
    flags: i
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/plan.md
  - name: plan-is-a-draft
    type: regex
    pattern: '"status"\s*:\s*"draft"'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting-space/intent/demo/2026-11-01-greeting-space/plan.md
  - name: product-code-unedited
    type: regex
    pattern: 'echo "Welcome back\$\{2:\+,\$2\}"'
    target:
      source: file
      path: app/greet.sh
  - name: product-repository-unchanged
    type: regex
    pattern: '\tcommit \(amend\): feat: greet visitors\n$'
    target:
      source: file
      path: app/.git/logs/HEAD
