schema_version: "1.1"
name: review-commits-findings
description: A fully built change (documents accepted, T1 committed with its trailers, its build-log entry committed) is reviewed. The review skill writes build/review.md in the change's copy as "## Review 1", and the Stop hook validates and commits only that file. The product repository's CONTRIBUTING.md requires a header on every shell script and its lint script enforces it; the change's new script, vip.sh, lacks it, so the review records a convention finding for app that cites the rule (B12, the review brief's convention rule). No product repository changes. Ported from the original's case of the same name; the commit now comes from the hook at the end of the turn, not from the model, so the grader reads the change's reflog.
tags: [review, b12]
plugins: ["../.bundle/claude-code"]
runs: 3
execution:
  prompt: |
    Run the final review of change 2026-11-01-vip-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: decide everything yourself and finish.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: review-commit-landed
    type: regex
    pattern: '\tcommit: docs\([^)]+\): (?:review|record review 1 of) 2026-11-01-vip-greeting\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-vip-greeting/logs/HEAD
  - name: review-is-the-only-commit-after-the-log
    type: regex
    pattern: 'log T1 of 2026-11-01-vip-greeting\n(?:[^\n]*\n)*?[^\n]*\tcommit[^:\n]*: (?!docs\([^)]+\): (?:review|record review 1 of) 2026-11-01-vip-greeting\n)'
    match: not_contains
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-vip-greeting/logs/HEAD
  - name: master-main-gains-no-commit
    type: regex
    pattern: '^[^\n]*\tcommit \(initial\): chore\(demo\): set up hoshin for demo\n$'
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: product-repository-unchanged
    type: regex
    pattern: '\tcommit: feat\(demo\): greet vip visitors as guests of honor\n$'
    target:
      source: file
      path: app/.git/logs/HEAD
  - name: review-is-layout-2
    type: regex
    pattern: '"layout"\s*:\s*2'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
  - name: review-section-exists
    type: regex
    pattern: '^## Review 1\s*$'
    flags: m
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
  - name: findings-name-the-repository
    type: regex
    pattern: '"repo"\s*:\s*"app"'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
  - name: convention-finding-cites-the-written-rule
    type: regex
    pattern: '\{(?=[^{}]*"concern"\s*:\s*"convention")(?=[^{}]*"repo"\s*:\s*"app")(?=[^{}]*"rule"\s*:\s*"CONTRIBUTING\.md:[56](?:-[56])?")(?=[^{}]*"file"\s*:\s*"[^"]*vip\.sh")[^{}]*\}'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-vip-greeting/intent/demo/2026-11-01-vip-greeting/build/review.md
