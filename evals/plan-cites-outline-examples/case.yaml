schema_version: "1.1"
name: plan-cites-outline-examples
description: The spec states the home page greeting as one Scenario Outline over three conditions, and its Examples list every reachable combination. That decision has three inputs, so the plan's decision-table rule applies, but the spec's Examples already are the table. The plan's task cites the outline's Examples in its Change instead of copying the rows into a table of its own, so the builder and the reviewer read one table (B10, the decision-table rules). Ported from the original's case of the same name.
tags: [plan, decision-tables, b10]
runs: 3
execution:
  prompt: |
    Plan the change 2026-11-01-greeting in system demo. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: take the recommended answer to every question and finish the whole skill.
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-copy-of-the-examples
    type: regex
    pattern: '^[ \t>]*\|[^\n]*Welcome back, Mina'
    flags: m
    match: not_contains
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: change-cites-the-examples
    type: regex
    pattern: '#### Change\r?\n(?:(?!\n#{2,4} )[\s\S])*?\bExamples\b'
    target:
      source: file
      path: .hoshin/copies/2026-11-01-greeting/intent/demo/2026-11-01-greeting/plan.md
  - name: plan-commit-landed
    type: regex
    pattern: '\tcommit: docs\([^)\s]+\): draft plan 2026-11-01-greeting\n'
    target:
      source: file
      path: master/.git/worktrees/2026-11-01-greeting/logs/HEAD
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
