schema_version: "1.1"
name: setup-refreshes-instructions
description: Asked only to refresh the workspace instructions, setup (instructions-only mode) regenerates intent/workspace.md, replaces the out-of-date block in the workspace CLAUDE.md and leaves the engineer's text on both sides of it alone, and commits only the instructions, as a refresh and not as a full setup (B09). Setup now gets a hook-issued step (D9, answered (a)), so the library writes and commits and the model never runs the instructions command or commits; the graders read the files and the master's reflog. Ported from the original's case of the same name.
tags: [setup, workspace, b09]
runs: 3
execution:
  prompt: |
    Refresh the workspace instructions. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: old-block-replaced
    type: regex
    pattern: 'OLD INSTRUCTIONS'
    match: not_contains
    target:
      source: file
      path: CLAUDE.md
  - name: old-instructions-replaced
    type: regex
    pattern: 'OLD INSTRUCTIONS'
    match: not_contains
    target:
      source: file
      path: master/intent/workspace.md
  - name: instructions-list-the-system
    type: regex
    pattern: '^\|\s*demo\s*\|\s*app\s*\|'
    flags: m
    target:
      source: file
      path: master/intent/workspace.md
  - name: block-holds-a-copy
    type: regex
    pattern: '<!-- hoshin:start -->\r?\n<!-- generated by hoshin setup from master/intent/workspace\.md[^\n]*\r?\n# hoshin workspace[\s\S]*^\|\s*demo\s*\|\s*app\s*\|[\s\S]*<!-- hoshin:end -->'
    flags: m
    target:
      source: file
      path: CLAUDE.md
  - name: block-appears-once
    type: regex
    pattern: 'hoshin:start[\s\S]*hoshin:start'
    match: not_contains
    target:
      source: file
      path: CLAUDE.md
  - name: notes-before-kept
    type: regex
    pattern: '^# My notes\r?\n\r?\nKeep this line exactly as it is\.'
    target:
      source: file
      path: CLAUDE.md
  - name: notes-after-kept
    type: regex
    pattern: '<!-- hoshin:end -->\r?\n\r?\n## After\r?\n\r?\nKeep this line too\.\s*$'
    target:
      source: file
      path: CLAUDE.md
  - name: instructions-were-committed-as-a-refresh
    type: regex
    pattern: '\tcommit: chore\(demo\): refresh workspace instructions\n$'
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: not-two-refreshes
    type: regex
    pattern: '\tcommit: chore\(demo\): refresh workspace instructions\n[\s\S]*\tcommit: chore\(demo\): refresh workspace instructions\n'
    match: not_contains
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: no-full-setup-commit
    type: regex
    pattern: '\tcommit: chore\(demo\): set up hoshin for demo\n'
    match: not_contains
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: no-other-commit-landed
    type: regex
    pattern: '\tcommit(?: \(\w+\))?: (?!chore\(demo\): (?:set up hoshin for demo|write workspace instructions|refresh workspace instructions)\n)'
    match: not_contains
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: marker-untouched
    type: regex
    pattern: '^\{ "version": 1, "systems": \{ "demo": \{ "repos": \["app"\] \} \}, "hooks": \{ "build\.finish": \[\{ "id": "unit", "run": \["bash", "test\.sh"\] \}\] \} \}\s*$'
    target:
      source: file
      path: master/.hoshin.json
