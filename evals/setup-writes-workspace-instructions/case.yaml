schema_version: "1.1"
name: setup-writes-workspace-instructions
description: Rerunning setup for an existing system writes intent/workspace.md in the master repository from the marker, commits it as the usual setup commit, and appends a block holding a full copy of it to the workspace CLAUDE.md without touching the engineer's own notes there (B09). Setup now gets a hook-issued step (D9, answered (a)), so the library writes and commits what the engineer settled and the model never runs the instructions command or commits; the graders read the files and the master's reflog. The engineer's marker is kept as it is. Ported from the original's case of the same name.
tags: [setup, workspace, b09]
runs: 3
execution:
  prompt: |
    Set up hoshin for system demo. Keep its repositories as they are. This session runs in the workspace folder, which holds the master repository (master/) and the app (app/). I am not available for questions: decide everything yourself.
  max_turns: 25
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?setup"'
  - name: hook-trace-has-an-entry
    type: regex
    pattern: '"command"\s*:\s*"hook start"'
    target:
      source: file
      path: master/.git/hoshin/hooks.jsonl
  - name: no-hand-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-[Cc]\s+\S+\s+)*commit\b'
    min: 0
    max: 0
  - name: instructions-list-the-system
    type: regex
    pattern: '^\|\s*demo\s*\|\s*app\s*\|'
    flags: m
    target:
      source: file
      path: master/intent/workspace.md
  - name: instructions-point-at-context
    type: regex
    pattern: 'master/intent/demo/context/'
    target:
      source: file
      path: master/intent/workspace.md
  - name: instructions-have-no-placeholders-left
    type: regex
    pattern: '<master>|\|\s*<system>\s*\||<repo>, <repo>'
    match: not_contains
    target:
      source: file
      path: master/intent/workspace.md
  - name: setup-commit-landed
    type: regex
    pattern: '\tcommit: chore\(demo\): set up hoshin for demo\n'
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: not-two-setup-commits
    type: regex
    pattern: '\tcommit: chore\(demo\): set up hoshin for demo\n[\s\S]*\tcommit: chore\(demo\): set up hoshin for demo\n'
    match: not_contains
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: no-other-commit-landed
    type: regex
    pattern: '\tcommit(?: \(\w+\))?: (?!chore\(demo\): set up hoshin for demo\n)'
    match: not_contains
    target:
      source: file
      path: master/.git/logs/HEAD
  - name: marker-keeps-the-repositories
    type: regex
    pattern: '"demo"\s*:\s*\{\s*"repos"\s*:\s*\[\s*"app"\s*\]\s*\}'
    target:
      source: file
      path: master/.hoshin.json
  - name: block-holds-a-copy
    type: regex
    pattern: '<!-- hoshin:start -->\r?\n<!-- generated by hoshin setup from master/intent/workspace\.md[^\n]*\r?\n# hoshin workspace[\s\S]*^\|\s*demo\s*\|\s*app\s*\|[\s\S]*<!-- hoshin:end -->'
    flags: m
    target:
      source: file
      path: CLAUDE.md
  - name: block-appears-once
    type: regex
    pattern: 'hoshin:start[\s\S]*hoshin:start'
    match: not_contains
    target:
      source: file
      path: CLAUDE.md
  - name: engineer-notes-kept
    type: regex
    pattern: '^# My notes\r?\n\r?\nKeep this line exactly as it is\.'
    target:
      source: file
      path: CLAUDE.md
  - name: report-gives-the-next-step
    type: regex
    pattern: '/?(?:hoshin:)?intent\b'
    target: last_message
