name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-unit:
    name: build & unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build solution (warnings as errors)
        run: dotnet build Hoshin.sln --configuration Release -p:TreatWarningsAsErrors=true

      - name: Run unit, migration, state-machine, and dual-harness hook tests
        run: dotnet test tests/Hoshin.Tests/Hoshin.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~BlackBoxConformanceTests" --logger "trx;LogFileName=unit-${{ matrix.os }}.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-${{ matrix.os }}
          path: tests/Hoshin.Tests/TestResults/*.trx
          if-no-files-found: ignore

  blackbox-conformance:
    name: black-box conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build solution
        run: dotnet build Hoshin.sln --configuration Release

      - name: Run all 44 black-box CLI conformance suites
        run: dotnet test tests/Hoshin.Tests/Hoshin.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~BlackBoxConformanceTests" --logger "trx;LogFileName=blackbox-${{ matrix.os }}.trx"

      - name: Upload black-box test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-blackbox-${{ matrix.os }}
          path: tests/Hoshin.Tests/TestResults/*.trx
          if-no-files-found: ignore

  package:
    name: package release bundles
    needs: [build-and-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build portable CLI, NuGet package, Claude Code plugin, and Antigravity bundle
        shell: pwsh
        run: ./packaging/package.ps1 -Configuration Release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshin-net-release-artifacts
          path: artifacts/
          retention-days: 14
